<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Pociťátko · přihlášení</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #18231f; color: #f4f1e8; }
      main { width: min(32rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #557166; border-radius: 1rem; background: #21312b; box-shadow: 0 1rem 3rem #0006; }
      h1 { margin-top: 0; font-size: 1.5rem; }
      p { line-height: 1.55; }
      [data-error="true"] { color: #ffb4ab; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pociťátko</h1>
      <p id="status">Připravuji bezpečné přihlášení…</p>
    </main>
    <script src="./bridge.js" defer></script>
  </body>
</html>
